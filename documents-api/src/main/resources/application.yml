spring:
  application:
    name: documents-api
  datasource:
    url: jdbc:postgresql://localhost:5432/docdb
    username: cdc
    password: cdc
  jpa:
    hibernate:
      # Le schema est cree par infra/init-scripts/, on ne laisse pas Hibernate y toucher.
      ddl-auto: none
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

server:
  port: 8081

minio:
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket: documents

app:
  security:
    # Utilisateur unique en dur (demo/soutenance) : pas de table users, hors perimetre.
    # Le meme JWT_SECRET doit etre partage par les 6 services (pas de gateway central).
    username: ${AUTH_USERNAME:wassim}
    password-hash: ${AUTH_PASSWORD_HASH:$2a$10$WfuQ1zBMtrudtB9heplDWumzmCG3ZcxiqMT/dYTnDArcILzKOXVxO}
    jwt-secret: ${JWT_SECRET:changeme-jwt-secret-cdc-streaming-pipeline-emsi-2026}
    jwt-ttl-minutes: ${JWT_TTL_MINUTES:480}
