spring:
  application:
    name: ocr-service
  datasource:
    url: jdbc:postgresql://localhost:5432/docdb
    username: cdc
    password: cdc
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  kafka:
    # 9094 = listener hote de Kafka (l'app tourne hors Docker)
    bootstrap-servers: localhost:9094
    consumer:
      group-id: ocr-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      # utilise par le DeadLetterPublishingRecoverer pour republier les messages en erreur
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

server:
  port: 8087

minio:
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket: documents

# OCR images (Should) : necessite le binaire Tesseract + les fichiers de langue (tessdata)
# installes sur la machine hote. Voir README pour la procedure. datapath = dossier qui
# contient les .traineddata (fra.traineddata, eng.traineddata), pas le fichier lui-meme.
tesseract:
  datapath: ${TESSERACT_DATAPATH:tessdata}
  languages: ${TESSERACT_LANGUAGES:fra+eng}
